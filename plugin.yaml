name: alfred-odoo
version: 0.3.0
manifest_version: 2
api_version: 1
label: "Odoo CRM"
description: "Odoo 16/17/18 CRM over JSON-RPC: read leads and opportunities, pipeline by stage or salesperson, partners, activities and chatter; optionally log notes, schedule activities and move stages, each confirmed by a human."
author: Blubobo1010
license: MIT
homepage: https://github.com/Blubobo1010/alfred-odoo
tags: [crm, odoo, sales]
kind: standalone
requires_hermes: ">=0.21.6"
requires_env:
  - name: ODOO_URL
    description: "Base URL of your Odoo, e.g. https://mycompany.odoo.com or https://erp.example.com"
  - name: ODOO_DB
    description: "Database name (odoo.sh: the branch's database; self-hosted: the name in the database selector)"
  - name: ODOO_USERNAME
    description: "Login of the Odoo user the assistant acts as (usually an email); a dedicated user with Sales / User rights only is recommended"
  - name: ODOO_API_KEY
    description: "API key of that user: Odoo > avatar > My Profile > Account Security > New API Key"
    url: https://www.odoo.com/documentation/17.0/developer/reference/external_api.html#api-keys
    secret: true
provides_tools:
  - odoo_crm_vocabulary
  - odoo_search_leads
  - odoo_get_lead
  - odoo_pipeline_summary
  - odoo_search_partners
  - odoo_timeline
  - odoo_list_activities
  - odoo_describe_model
  - odoo_query
  - odoo_log_note
  - odoo_schedule_activity
  - odoo_update_lead_stage
provides_hooks:
  - pre_tool_call
config_schema:
  enabled_areas:
    type: list
    default: []
    label: "Enabled Odoo data areas"
    description: "Default-deny: the assistant reads (and writes) only these areas — crm (leads, stages, teams, tags), contacts (res.partner), activities, chatter (messages, notes, stage history). Enable an area only after checking its data with the customer; empty = nothing is read"
  revenue_range:
    type: list
    default: []
    label: "Plausible expected revenue range"
    description: "[min, max] in company currency (max 0 = no upper bound). Amounts outside it are flagged as suspect and left out of pipeline sums; empty = no check. Kimera: [100000, 2000000]"
  custom_fields:
    type: list
    default: []
    label: "Extra opportunity fields"
    description: "label=field entries for crm.lead fields to show on leads and group the pipeline by, e.g. [\"model=x_studio_modello_auto_1\"]. Plain or many2one fields only"
  default_limit:
    type: int
    default: 20
    description: "Rows per page for list tools (max 100)"
  timezone:
    type: str
    default: ""
    description: "IANA time zone for displayed datetimes (e.g. Europe/Rome); empty = the Odoo user's time zone"
  lang:
    type: str
    default: ""
    description: "Odoo context language (e.g. it_IT); empty = the Odoo user's language"
  company_ids:
    type: list
    default: []
    description: "Restrict queries to these company ids (multi-company); empty = the user's allowed companies"
  default_team:
    type: str
    default: ""
    description: "Sales team name applied when the question does not name one"
  timeout_seconds:
    type: int
    default: 20
    description: "HTTP timeout per Odoo call"
  max_body_chars:
    type: int
    default: 800
    description: "Per-message cap for chatter and description text"
  advanced_tools:
    type: bool
    default: false
    label: "Enable generic query tools"
    description: "Exposes odoo_query and odoo_describe_model (read-only, allow-listed models only)"
  write_enabled:
    type: bool
    default: false
    label: "Enable CRM writes (with approval)"
    description: "Exposes odoo_log_note, odoo_schedule_activity and odoo_update_lead_stage; every call must be approved by a human (CLI prompt or chat buttons) before it runs"
