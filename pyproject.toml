# Development tooling only. The plugin has NO runtime dependencies (stdlib JSON-RPC), so Hermes
# never prompts for packages at install time.
[project]
name = "alfred-odoo"
version = "0.1.0"
description = "Read-only Odoo CRM tools for Alfred / Hermes Agent"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# pytest configuration lives in tests/pytest.ini (run `uv run pytest tests`): the repo root is the
# plugin package itself and must not be collected as a test package.

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
